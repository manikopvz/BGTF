name: Hoàn tất mã nguồn BGTF

on:
  push:
    paths:
      - 'release/**'
      - '.github/workflows/unpack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bung gói mã nguồn
        shell: bash
        run: |
          set -euo pipefail
          cat release/part-*.b64 > /tmp/bgtf-release.b64
          base64 -d /tmp/bgtf-release.b64 > /tmp/bgtf-release.tar.gz
          tar -xzf /tmp/bgtf-release.tar.gz -C .
          rm -rf release bootstrap .github/workflows/unpack.yml
      - name: Ghi mã nguồn vào main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement playable BGTF web game"
          git push
