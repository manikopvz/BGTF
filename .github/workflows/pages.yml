name: Kiểm thử và triển khai GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm thử luật
        run: npm test
      - name: Mô phỏng 400 ván
        run: npm run simulate

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
      - name: Đóng gói trang
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Triển khai
        id: deployment
        uses: actions/deploy-pages@v4
